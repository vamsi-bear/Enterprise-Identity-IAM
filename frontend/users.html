<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Enterprise IAM - User Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .navbar {
            background: #1e3a8a;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .logout:hover {
            background: #b91c1c;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;

            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.08);
        }

        h3 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .primary:hover {
            background: #1d4ed8;
        }

        .refresh {
            background: #0f766e;
            color: white;
        }

        .refresh:hover {
            background: #115e59;
        }

        .edit {
            background: #f59e0b;
            color: white;
            margin-right: 5px;
        }

        .edit:hover {
            background: #d97706;
        }

        .delete {
            background: #dc2626;
            color: white;
        }

        .delete:hover {
            background: #b91c1c;
        }

        .assign {
            background: #7c3aed;
            color: white;
        }

        .assign:hover {
            background: #6d28d9;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #f8fafc;
        }

        tr:hover {
            background: #f8fafc;
        }

        .actions {
            white-space: nowrap;
        }

        .role-select {
            width: 140px;
            margin-right: 5px;
        }

        /* ==============================
           MODAL
        ============================== */

        .modal {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.5);

            justify-content: center;
            align-items: center;

            z-index: 1000;
        }

        .modal-content {
            background: white;

            width: 450px;
            max-width: 90%;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .modal-content h3 {
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel {
            background: #64748b;
            color: white;
        }

        .cancel:hover {
            background: #475569;
        }

        @media (max-width: 800px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<div class="navbar">

    <h2>
        Enterprise IAM - User Management
    </h2>

    <button
        class="logout"
        onclick="logout()"
    >
        Logout
    </button>

</div>


<div class="container">


    <!-- =====================================================
         CREATE USER
    ====================================================== -->

    <div class="card">

        <h3>
            Create User
        </h3>

        <form id="createUserForm">

            <div class="form-grid">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <input
                    type="text"
                    id="firstName"
                    placeholder="First Name"
                >

                <input
                    type="text"
                    id="lastName"
                    placeholder="Last Name"
                >

                <select id="role">

                    <option value="">
                        Select Role
                    </option>

                    <option value="EMPLOYEE">
                        EMPLOYEE
                    </option>

                    <option value="DEVELOPER">
                        DEVELOPER
                    </option>

                    <option value="ADMIN">
                        ADMIN
                    </option>

                    <option value="SUPER_ADMIN">
                        SUPER_ADMIN
                    </option>

                </select>

            </div>

            <br>

            <button
                type="submit"
                class="primary"
            >
                Create User
            </button>

        </form>

        <div
            id="createMessage"
            class="message"
        ></div>

    </div>


    <!-- =====================================================
         USERS
    ====================================================== -->

    <div class="card">

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:20px;
            "
        >

            <h3>
                Users
            </h3>

            <button
                class="refresh"
                onclick="loadUsers()"
            >
                Refresh Users
            </button>

        </div>


        <div style="overflow-x:auto;">

            <table>

                <thead>

                    <tr>

                        <th>
                            Username
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Role
                        </th>

                        <th>
                            Assign Role
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>

                <tbody id="usersTableBody">

                    <tr>

                        <td colspan="6">
                            Loading users...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- =========================================================
     EDIT USER MODAL
========================================================= -->

<div
    id="editModal"
    class="modal"
>

    <div class="modal-content">

        <h3>
            Edit User
        </h3>

        <input
            type="hidden"
            id="editUserId"
        >

        <label>
            Username
        </label>

        <input
            type="text"
            id="editUsername"
            disabled
        >

        <br><br>

        <label>
            Email
        </label>

        <input
            type="email"
            id="editEmail"
        >

        <br><br>

        <label>
            First Name
        </label>

        <input
            type="text"
            id="editFirstName"
        >

        <br><br>

        <label>
            Last Name
        </label>

        <input
            type="text"
            id="editLastName"
        >

        <br><br>

        <label>
            New Password
            <small>
                (leave empty to keep current password)
            </small>
        </label>

        <input
            type="password"
            id="editPassword"
            placeholder="New password"
        >

        <div class="modal-buttons">

            <button
                class="primary"
                onclick="updateUser()"
            >
                Update User
            </button>

            <button
                class="cancel"
                onclick="closeEditModal()"
            >
                Cancel
            </button>

        </div>

        <div
            id="editMessage"
            class="message"
        ></div>

    </div>

</div>


<script>


// ============================================================
// API CONFIGURATION
// ============================================================

const API_URL = "https://enterprise-identity-iam.onrender.com";


// ============================================================
// AUTHENTICATION
// ============================================================

const token =
    localStorage.getItem("token");

if (!token) {

    window.location.href =
        "login.html";
}


// ============================================================
// LOAD USERS
// ============================================================

async function loadUsers() {

    const tableBody =
        document.getElementById(
            "usersTableBody"
        );

    tableBody.innerHTML = `
        <tr>
            <td colspan="6">
                Loading users...
            </td>
        </tr>
    `;

    try {

        const response =
            await fetch(
                `${API_URL}/api/users`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );

        const data =
            await response.json();

        console.log(
            "Users response:",
            data
        );


        if (response.status === 401) {

            handleUnauthorized();

            return;
        }


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Unable to load users"
            );
        }


        renderUsers(
            data.users
        );


    } catch (error) {

        console.error(
            "Load users error:",
            error
        );

        tableBody.innerHTML = `
            <tr>
                <td colspan="6">
                    Unable to load users
                </td>
            </tr>
        `;

    }

}


// ============================================================
// RENDER USERS
// ============================================================

function renderUsers(users) {

    const tableBody =
        document.getElementById(
            "usersTableBody"
        );


    if (!users || users.length === 0) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="6">
                    No users found.
                </td>
            </tr>
        `;

        return;
    }


    tableBody.innerHTML = "";


    users.forEach(user => {

        const row =
            document.createElement("tr");


        const fullName =
            [
                user.firstName,
                user.lastName
            ]
            .filter(Boolean)
            .join(" ") || "-";


        row.innerHTML = `

            <td>
                ${escapeHtml(user.username)}
            </td>

            <td>
                ${escapeHtml(user.email)}
            </td>

            <td>
                ${escapeHtml(fullName)}
            </td>

            <td>
                ${escapeHtml(user.role || "EMPLOYEE")}
            </td>

            <td>

                <select
                    class="role-select"
                    id="role-${user.id}"
                >

                    <option value="">
                        Select
                    </option>

                    <option value="EMPLOYEE">
                        EMPLOYEE
                    </option>

                    <option value="DEVELOPER">
                        DEVELOPER
                    </option>

                    <option value="ADMIN">
                        ADMIN
                    </option>

                    <option value="SUPER_ADMIN">
                        SUPER_ADMIN
                    </option>

                </select>

                <button
                    class="assign"
                    onclick="assignRole('${user.id}')"
                >
                    Assign
                </button>

            </td>

            <td class="actions">

                <button
                    class="edit"
                    onclick='openEditModal(${JSON.stringify(user)})'
                >
                    Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteUser('${user.id}', '${escapeJs(user.username)}')"
                >
                    Delete
                </button>

            </td>

        `;


        tableBody.appendChild(row);

    });

}


// ============================================================
// CREATE USER
// ============================================================

document
    .getElementById("createUserForm")
    .addEventListener(
        "submit",
        createUser
    );


async function createUser(event) {

    event.preventDefault();


    const createMessage =
        document.getElementById(
            "createMessage"
        );


    const userData = {

        username:
            document
                .getElementById("username")
                .value
                .trim(),

        email:
            document
                .getElementById("email")
                .value
                .trim(),

        password:
            document
                .getElementById("password")
                .value,

        firstName:
            document
                .getElementById("firstName")
                .value
                .trim(),

        lastName:
            document
                .getElementById("lastName")
                .value
                .trim(),

        role:
            document
                .getElementById("role")
                .value

    };


    try {

        const response =
            await fetch(
                `${API_URL}/api/users`,
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body:
                        JSON.stringify(userData)
                }
            );


        const data =
            await response.json();


        console.log(
            "Create user response:",
            data
        );


        if (response.status === 401) {

            handleUnauthorized();

            return;
        }


        if (!response.ok || !data.success) {

            createMessage.textContent =
                data.message ||
                "Unable to create user";

            createMessage.className =
                "message error";

            return;
        }


        createMessage.textContent =
            "User created successfully.";

        createMessage.className =
            "message success";


        document
            .getElementById(
                "createUserForm"
            )
            .reset();


        await loadUsers();


    } catch (error) {

        console.error(
            "Create user error:",
            error
        );

        createMessage.textContent =
            "Unable to connect to server.";

        createMessage.className =
            "message error";

    }

}


// ============================================================
// OPEN EDIT MODAL
// ============================================================

function openEditModal(user) {

    document
        .getElementById("editUserId")
        .value = user.id;


    document
        .getElementById("editUsername")
        .value = user.username || "";


    document
        .getElementById("editEmail")
        .value = user.email || "";


    document
        .getElementById("editFirstName")
        .value =
            user.firstName || "";


    document
        .getElementById("editLastName")
        .value =
            user.lastName || "";


    document
        .getElementById("editPassword")
        .value = "";


    document
        .getElementById("editMessage")
        .textContent = "";


    document
        .getElementById("editModal")
        .style.display = "flex";

}


// ============================================================
// CLOSE EDIT MODAL
// ============================================================

function closeEditModal() {

    document
        .getElementById("editModal")
        .style.display = "none";

}


// ============================================================
// UPDATE USER
// ============================================================

async function updateUser() {

    const userId =
        document
            .getElementById("editUserId")
            .value;


    const email =
        document
            .getElementById("editEmail")
            .value
            .trim();


    const firstName =
        document
            .getElementById("editFirstName")
            .value
            .trim();


    const lastName =
        document
            .getElementById("editLastName")
            .value
            .trim();


    const password =
        document
            .getElementById("editPassword")
            .value;


    const editMessage =
        document
            .getElementById("editMessage");


    const body = {

        email,
        firstName,
        lastName

    };


    if (password) {

        body.password =
            password;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/users/${userId}`,
                {
                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body:
                        JSON.stringify(body)
                }
            );


        const data =
            await response.json();


        console.log(
            "Update user response:",
            data
        );


        if (response.status === 401) {

            handleUnauthorized();

            return;
        }


        if (!response.ok || !data.success) {

            editMessage.textContent =
                data.message ||
                "Unable to update user";

            editMessage.className =
                "message error";

            return;
        }


        editMessage.textContent =
            "User updated successfully.";

        editMessage.className =
            "message success";


        await loadUsers();


        setTimeout(() => {

            closeEditModal();

        }, 700);


    } catch (error) {

        console.error(
            "Update user error:",
            error
        );

        editMessage.textContent =
            "Unable to connect to server.";

        editMessage.className =
            "message error";

    }

}


// ============================================================
// DELETE USER
// ============================================================

async function deleteUser(
    userId,
    username
) {

    // ----------------------------------------
    // Confirm deletion
    // ----------------------------------------

    const confirmed =
        confirm(
            `Are you sure you want to delete "${username}"?`
        );


    if (!confirmed) {

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/users/${userId}`,
                {
                    method: "DELETE",

                    headers: {

                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        console.log(
            "Delete user response:",
            data
        );


        if (response.status === 401) {

            handleUnauthorized();

            return;
        }


        if (!response.ok || !data.success) {

            alert(
                data.message ||
                "Unable to delete user"
            );

            return;
        }


        alert(
            "User deleted successfully."
        );


        await loadUsers();


    } catch (error) {

        console.error(
            "Delete user error:",
            error
        );

        alert(
            "Unable to connect to server."
        );

    }

}


// ============================================================
// ASSIGN ROLE
// ============================================================

async function assignRole(userId) {

    const select =
        document.getElementById(
            `role-${userId}`
        );


    const role =
        select.value;


    if (!role) {

        alert(
            "Please select a role."
        );

        return;
    }


    try {

        /*
         * IMPORTANT:
         * This endpoint must exist in your backend.
         *
         * Change this URL if your existing
         * role assignment route is different.
         */

        const response =
            await fetch(
                `${API_URL}/api/users/${userId}/role`,
                {
                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body:
                        JSON.stringify({
                            role
                        })
                }
            );


        const data =
            await response.json();


        console.log(
            "Assign role response:",
            data
        );


        if (response.status === 401) {

            handleUnauthorized();

            return;
        }


        if (!response.ok || !data.success) {

            alert(
                data.message ||
                "Unable to assign role"
            );

            return;
        }


        alert(
            "Role assigned successfully."
        );


        await loadUsers();


    } catch (error) {

        console.error(
            "Assign role error:",
            error
        );

        alert(
            "Unable to connect to server."
        );

    }

}


// ============================================================
// LOGOUT
// ============================================================

function logout() {

    localStorage.removeItem(
        "token"
    );

    localStorage.removeItem(
        "user"
    );

    localStorage.removeItem(
        "mfaToken"
    );

    localStorage.removeItem(
        "mfaEmail"
    );


    window.location.href =
        "login.html";

}


// ============================================================
// UNAUTHORIZED
// ============================================================

function handleUnauthorized() {

    localStorage.removeItem(
        "token"
    );

    localStorage.removeItem(
        "user"
    );


    window.location.href =
        "login.html";

}


// ============================================================
// HTML ESCAPE
// ============================================================

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


// ============================================================
// JAVASCRIPT STRING ESCAPE
// ============================================================

function escapeJs(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }

    return String(value)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll("\n", "\\n")
        .replaceAll("\r", "\\r");

}


// ============================================================
// CLOSE MODAL WHEN CLICKING OUTSIDE
// ============================================================

window.addEventListener(
    "click",
    function(event) {

        const modal =
            document.getElementById(
                "editModal"
            );

        if (event.target === modal) {

            closeEditModal();

        }

    }
);


// ============================================================
// INITIAL LOAD
// ============================================================

loadUsers();

</script>


</body>

</html>
